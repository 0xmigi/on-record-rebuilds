# Test the proposed platform-tools release step ("ship one set of sbpf
# libraries in every tarball") against real release tarballs, end to end:
#   1. patch: download the four tarballs of a release, run the step verbatim,
#      check every tarball now carries byte-identical sbpf*-solana-solana dirs
#   2. build: build one program natively on macOS with the patched osx tarball
#      and on Linux with the stock linux tarball; the hashes should match
name: sbpf-libs-step
run-name: "One set of sbpf libs: platform-tools ${{ inputs.tools }}"

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "platform-tools release tag"
        required: true
        default: v1.58

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release tarballs
        run: |
          for t in linux-x86_64 linux-aarch64 osx-aarch64 windows-x86_64; do
            curl -sSfL -o "platform-tools-$t.tar.bz2" \
              "https://github.com/anza-xyz/platform-tools/releases/download/${{ inputs.tools }}/platform-tools-$t.tar.bz2"
          done
          ls -la *.tar.bz2

      # --- the proposed step, verbatim -----------------------------------------
      - name: Ship one set of sbpf libraries in every tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir ref
          tar -xjf platform-tools-linux-x86_64.tar.bz2 -C ref --wildcards './rust/lib/rustlib/sbpf*-solana-solana'
          for t in platform-tools-linux-aarch64 platform-tools-osx-aarch64 platform-tools-windows-x86_64; do
            mkdir "$t"
            tar -xjf "$t.tar.bz2" -C "$t"
            for d in ref/rust/lib/rustlib/sbpf*-solana-solana; do
              rm -rf "$t/rust/lib/rustlib/$(basename "$d")"
              cp -R "$d" "$t/rust/lib/rustlib/"
            done
            tar -C "$t" -jcf "$t.tar.bz2" .
            rm -rf "$t"
          done
          rm -rf ref
      # --------------------------------------------------------------------------

      - name: Check every tarball now has identical sbpf libraries
        run: |
          for t in linux-x86_64 linux-aarch64 osx-aarch64 windows-x86_64; do
            mkdir "chk-$t"
            tar -xjf "platform-tools-$t.tar.bz2" -C "chk-$t" --wildcards './rust/lib/rustlib/sbpf*-solana-solana'
            sum=$(cd "chk-$t/rust/lib/rustlib" && find . -type f | sort | xargs sha256sum | sha256sum | cut -c1-16)
            echo "$t: sbpf libs digest $sum ($(cd "chk-$t/rust/lib/rustlib" && find . -name '*.rlib' | wc -l) rlibs)"
            echo "$sum" >> digests.txt
          done
          [ "$(sort -u digests.txt | wc -l)" = 1 ] && echo "ALL IDENTICAL" || { echo "DIFFER"; exit 1; }
          # the rest of each tarball must be untouched: its own host compiler
          tar -tjf platform-tools-osx-aarch64.tar.bz2 | grep -c 'rustlib/aarch64-apple-darwin' | xargs echo "osx tarball still has its macOS host libs:"

      # every tarball after the step: the three patched ones and the Linux x86
      # reference, which the step leaves alone
      - uses: actions/upload-artifact@v4
        with: { name: tarball-linux-x86_64, path: platform-tools-linux-x86_64.tar.bz2, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with: { name: tarball-linux-aarch64, path: platform-tools-linux-aarch64.tar.bz2, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with: { name: tarball-osx-aarch64, path: platform-tools-osx-aarch64.tar.bz2, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with: { name: tarball-windows-x86_64, path: platform-tools-windows-x86_64.tar.bz2, compression-level: 0 }

  build:
    needs: patch
    name: livestock · ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     tar: linux-x86_64,   solana: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04,     tar: linux-x86_64,   solana: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, tar: linux-aarch64,  solana: aarch64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, tar: linux-aarch64,  solana: aarch64-unknown-linux-gnu }
          - { runner: macos-14,         tar: osx-aarch64,    solana: aarch64-apple-darwin }
          - { runner: macos-15,         tar: osx-aarch64,    solana: aarch64-apple-darwin }
          - { runner: macos-26,         tar: osx-aarch64,    solana: aarch64-apple-darwin }
          - { runner: windows-2022,     tar: windows-x86_64, solana: x86_64-pc-windows-msvc }
          - { runner: windows-2025,     tar: windows-x86_64, solana: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cargo-build-sbf 4.1.0 (${{ matrix.solana }})
        run: |
          if [ "${{ matrix.solana }}" = aarch64-unknown-linux-gnu ]; then
            # Anza publishes no Solana CLI release for Linux ARM; cargo-build-sbf
            # itself is on crates.io at the same version
            sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev libudev-dev
            cargo install cargo-build-sbf --version 4.1.0 --locked
          else
            curl -sSfL --retry 3 -o solana.tar.bz2 \
              "https://github.com/anza-xyz/agave/releases/download/v4.1.0/solana-release-${{ matrix.solana }}.tar.bz2"
            # on Windows, GNU tar reads "D:\..." as host:path; hand it a POSIX path
            DEST="$RUNNER_TEMP"; command -v cygpath >/dev/null && DEST=$(cygpath -u "$RUNNER_TEMP")
            tar -xjf solana.tar.bz2 -C "$DEST" && rm solana.tar.bz2
            ls "$DEST/solana-release/bin" | grep -i build-sbf
            echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: tarball-${{ matrix.tar }}
      - name: Put platform-tools ${{ inputs.tools }} in place (${{ matrix.tar }})
        run: |
          # Windows: cargo-build-sbf (<= 4.4.0) panics on any non-default
          # --tools-version there — get_base_rust_version looks for `rustc`, not
          # `rustc.exe`. Put the same files under its default version's folder
          # and build without --tools-version; compiler and libraries are unchanged.
          V="${{ inputs.tools }}"; [ "$RUNNER_OS" = Windows ] && V=v1.54
          D="$HOME/.cache/solana/$V/platform-tools"
          mkdir -p "$D"
          tar -xjf "platform-tools-${{ matrix.tar }}.tar.bz2" -C "$D"
          ls "$D/rust/lib/rustlib"
      - name: Build Livestock
        run: |
          PY=$(command -v python3 || command -v python)
          git clone -q https://github.com/0xmigi/livestock src
          git -C src checkout -q be8caf16fcad4429fbb5fd39d150291a3e1998c7
          M=$(cd src && "$PY" "$GITHUB_WORKSPACE/tools/scripts/find-manifest.py" livestock)
          cd "$(dirname "src/$M")"
          if [ "$RUNNER_OS" = Windows ]; then
            cargo-build-sbf -- --locked
          else
            cargo-build-sbf --tools-version ${{ inputs.tools }} -- --locked
          fi
      - name: Hash
        run: |
          PY=$(command -v python3 || command -v python)
          so=$(find src -path '*/target/deploy/livestock.so' | head -1)
          echo "${{ matrix.runner }} (${{ matrix.tar }}): $("$PY" tools/scripts/exe-hash.py "$so")" | tee hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.runner }}
          path: hash.txt
